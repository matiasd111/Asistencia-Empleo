<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia - Empleo y Selección</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #d4a574 0%, #c89f6f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #c89f6f 0%, #b8905f 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #c89f6f;
            box-shadow: 0 0 0 3px rgba(200, 159, 111, 0.1);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #c89f6f 0%, #b8905f 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(200, 159, 111, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-limpiar {
            background: #f0f0f0;
            color: #333;
        }

        .btn-limpiar:hover {
            background: #e0e0e0;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: #c89f6f;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #c89f6f;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c89f6f;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }

            .content {
                padding: 25px;
            }

            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Empleo y Selección</h1>
            <p>Registrar Asistencia</p>
        </div>

        <div class="content">
            <div class="info-box">
                ℹ️ Completa tus datos para registrar tu asistencia a clase.
            </div>

            <div id="message" class="message"></div>

            <form id="asistenciaForm">
                <div class="form-group">
                    <label for="nombre">Nombre y Apellido *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Ej: Juan García"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="comision">Comisión *</label>
                    <select id="comision" name="comision" required>
                        <option value="">-- Selecciona tu comisión --</option>
                        <option value="Comisión 1">Comisión 1</option>
                        <option value="Comisión 2">Comisión 2</option>
                    </select>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Registrando asistencia...</p>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        Confirmar Asistencia
                    </button>
                    <button type="reset" class="btn-limpiar">
                        Limpiar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // URL del Apps Script (REEMPLAZA CON TU URL)
       const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzD1hCVFTG97cZDGHPBLU4xPdcktbufpuQRkkX_pER2wMZNAMUNMTbYZQt7SRWDknGa/exec';

        // Generar un ID único para este dispositivo
        function getDeviceId() {
            let deviceId = localStorage.getItem('deviceId');
            if (!deviceId) {
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('deviceId', deviceId);
            }
            return deviceId;
        }

        const form = document.getElementById('asistenciaForm');
        const messageDiv = document.getElementById('message');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Obtener datos
            const nombre = document.getElementById('nombre').value.trim();
            const comision = document.getElementById('comision').value;
            const deviceId = getDeviceId();

            // Validar
            if (!nombre || !comision) {
                mostrarMensaje('Por favor completa todos los campos', 'error');
                return;
            }

            // Mostrar carga
            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;
            messageDiv.style.display = 'none';

            try {
                // Enviar datos al Apps Script
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        nombre: nombre,
                        comision: comision,
                        deviceId: deviceId
                    })
                });

                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (data.success) {
                    mostrarMensaje('✅ ' + data.message, 'success');
                    form.reset();
                    setTimeout(() => {
                        messageDiv.style.display = 'none';
                    }, 5000);
                } else {
                    mostrarMensaje('⚠️ ' + data.message, 'error');
                }

            } catch (error) {
                loadingDiv.style.display = 'none';
                console.error('Error:', error);
                mostrarMensaje('Error al registrar. Intenta nuevamente.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function mostrarMensaje(texto, tipo) {
            messageDiv.textContent = texto;
            messageDiv.className = 'message ' + tipo;
            messageDiv.style.display = 'block';
        }

        // Log para verificar
        console.log('Dispositivo ID:', getDeviceId());
    </script>
</body>
</html>
